name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend (Build & Typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production Build & Typecheck
        run: npm run build

  backend:
    name: Backend (Build & Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production Build
        run: npm run build

      - name: Verify Compiled Runtime Startup
        run: node -e "import('./dist/app.js').then(() => console.log('App loaded successfully')).catch((e) => { console.error(e); process.exit(1); })"
        env:
          JWT_ACCESS_SECRET: ci_test_jwt_access_secret_1234567890
          JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_1234567890
          MONGODB_URI: mongodb://127.0.0.1:27017/collabboard-ci

      - name: Run Automated Backend Tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: ci_test_jwt_access_secret_1234567890
          JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_1234567890
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/collabboard-ci-test

  docker:
    name: Docker Production Images
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Stack
        run: docker compose build
        env:
          JWT_ACCESS_SECRET: dummy_secret_for_build
          JWT_REFRESH_SECRET: dummy_secret_for_build
          MONGODB_URI: mongodb://mongodb:27017/collabboard
