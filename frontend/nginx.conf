# Nginx configuration for Vite SPA with backend API and WebSocket proxy

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Increase header/cookie buffer size for JWT tokens
    # Default 8k is too small for access + refresh token cookies
    client_header_buffer_size 16k;
    large_client_header_buffers 4 32k;

    # Gzip compression for better performance
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json;
    gzip_min_length 1000;

    # Reverse proxy for backend API endpoints
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy for Socket.IO WebSocket and polling
    location /socket.io/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static files with proper caching
    location / {
        root /usr/share/nginx/html;
        
        # SPA routing - fallback to index.html
        try_files $uri $uri/ /index.html;
        
        # Cache static assets with hash in filename (Vite)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Don't cache HTML files
        location ~* \.html?$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # Deny access to hidden files/directories
    location ~ /\. {
        deny all;
    }
}
